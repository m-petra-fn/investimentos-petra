spring.application.name=demo
spring.datasource.url=jdbc:h2:mem:investimentosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.output.ansi.enabled=ALWAYS

management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,configprops
management.endpoint.health.show-details=always
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.metrics.distribution.percentiles-histogram.app.layer.execution=true
management.metrics.tags.application=${spring.application.name}

# Shows trace/span correlation in logs when tracing is active.
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Zipkin configuration for distributed tracing
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# Legacy Sleuth property removed; Micrometer Tracing is used in Spring Boot 4.

